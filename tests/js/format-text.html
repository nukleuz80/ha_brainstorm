<!doctype html>
<!-- Browser test for formatText. Run: python3 -m http.server in the repo root,
     open http://localhost:8000/tests/js/format-text.html, it shows PASS or the failures. --><meta charset="utf-8"><body><pre id="out">running</pre>
<script type="module">
import { formatText } from "../../custom_components/brainstorm/cards/brainstorm-i18n.js";
const cases = [
 ["plain <b>x</b> & 'y'", "plain &lt;b&gt;x&lt;/b&gt; &amp; &#039;y&#039;"],
 ["see https://example.com/a?b=1&c=2.", 'see <a class="bs-link" href="https://example.com/a?b=1&amp;c=2" target="_blank" rel="noopener noreferrer">https://example.com/a?b=1&amp;c=2</a>.'],
 ["(https://de.wikipedia.org/wiki/Foo_(Bar))", '(<a class="bs-link" href="https://de.wikipedia.org/wiki/Foo_(Bar)" target="_blank" rel="noopener noreferrer">https://de.wikipedia.org/wiki/Foo_(Bar)</a>)'],
 ["[Doku](https://ha.io/x) lesen", '<a class="bs-link" href="https://ha.io/x" target="_blank" rel="noopener noreferrer">Doku</a> lesen'],
 ["[böse](javascript:alert(1))", "[böse](javascript:alert(1))"],
 ['[x](https://a.b/"onmouseover=alert(1))', '[x](<a class="bs-link" href="https://a.b/" target="_blank" rel="noopener noreferrer">https://a.b/</a>&quot;onmouseover=alert(1))'],
 ['[x](https://a.b/"onmouseover=x)', '<a class="bs-link" href="https://a.b/%22onmouseover=x" target="_blank" rel="noopener noreferrer">x</a>'],
 ['https://a.b/"><img src=x onerror=alert(1)>', '<a class="bs-link" href="https://a.b/" target="_blank" rel="noopener noreferrer">https://a.b/</a>&quot;&gt;&lt;img src=x onerror=alert(1)&gt;'],
 ["**fett** und *kursiv* und ~~weg~~", "<strong>fett</strong> und <em>kursiv</em> und <s>weg</s>"],
 ["`<script>` **`a`**", "<code>&lt;script&gt;</code> <strong><code>a</code></strong>"],
 ["5 * 3 * 2 und snake_case_name", "5 * 3 * 2 und snake_case_name"],
 ["**<img src=x onerror=alert(1)>**", "<strong>&lt;img src=x onerror=alert(1)&gt;</strong>"],
 ["mailto ok [Jan](mailto:a@b.de)", 'mailto ok <a class="bs-link" href="mailto:a@b.de" target="_blank" rel="noopener noreferrer">Jan</a>'],
 [null, ""],
];
const fails = [];
for (const [input, want] of cases) { const got = formatText(input); if (got !== want) fails.push(`IN:   ${input}\nWANT: ${want}\nGOT:  ${got}`); }
// DOM check: no element other than a/strong/em/s/code, no on* attributes
const div = document.createElement("div");
for (const [input] of cases) div.innerHTML += formatText(input);
for (const el of div.querySelectorAll("*")) {
  if (!["A","STRONG","EM","S","CODE"].includes(el.tagName)) fails.push("bad tag " + el.tagName);
  for (const a of el.attributes) if (a.name.startsWith("on")) fails.push("bad attr " + a.name);
  if (el.tagName === "A" && !/^(https?:|mailto:)/.test(el.getAttribute("href"))) fails.push("bad href " + el.getAttribute("href"));
}
document.getElementById("out").textContent = fails.length ? "FAIL\n" + fails.join("\n\n") : `PASS ${cases.length}`;
</script>
