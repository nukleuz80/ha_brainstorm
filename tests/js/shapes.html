<!doctype html>
<!-- Browser test for the note shapes. Run: python3 -m http.server in the repo root,
     open http://localhost:8000/tests/js/shapes.html, it shows PASS or the failures. --><meta charset="utf-8"><body><pre id="out">running</pre>
<script type="module">
customElements.define("ha-card", class extends HTMLElement {});
const { shapeParts } = await import("../../www/brainstorm-mindmap-card.js");
const fails = [];
const check = (ok, text) => { if (!ok) fails.push(text); };
const tip = (parts) => parts[1].match(/L (-?[\d.]+) (-?[\d.]+)/).slice(1).map(Number);

// Cloud: a core and bumps around it, the same for the same note
const cloud = shapeParts("cloud", 220, 90, { seed: "abc" });
check(cloud[0].startsWith("<path"), "cloud starts with its core");
check(cloud.length >= 9, `cloud has bumps: ${cloud.length}`);
check(JSON.stringify(cloud) === JSON.stringify(shapeParts("cloud", 220, 90, { seed: "abc" })), "same seed, same cloud");
check(JSON.stringify(cloud) !== JSON.stringify(shapeParts("cloud", 220, 90, { seed: "xyz" })), "other seed, other cloud");
for (const c of cloud.slice(1)) {
  const [x, y, r] = c.match(/cx="([\d.]+)" cy="([\d.]+)" r="([\d.]+)"/).slice(1).map(Number);
  check(x - r > -20 && x + r < 240 && y - r > -20 && y + r < 110, `bump stays near the box: ${c}`);
}
check(shapeParts("cloud", 600, 300, { seed: "a" }).length > cloud.length, "a bigger cloud has more bumps");

// Bubble: the tail leaves on the side the parent lies
const [rx, ry] = tip(shapeParts("bubble", 200, 80, { angle: 0 }));
check(rx > 200 && ry > 0 && ry < 80, `tail right: ${rx},${ry}`);
const [lx] = tip(shapeParts("bubble", 200, 80, { angle: Math.PI }));
check(lx < 0, `tail left: ${lx}`);
const [, dy] = tip(shapeParts("bubble", 200, 80, { angle: Math.PI / 2 }));
check(dy > 80, `tail down: ${dy}`);
const [, uy] = tip(shapeParts("bubble", 200, 80, { angle: -Math.PI / 2 }));
check(uy < 0, `tail up: ${uy}`);
// A steep corner angle keeps the tail off the rounded corner
const corner = shapeParts("bubble", 200, 80, { angle: Math.atan2(40, 100.5) })[1];
const ys = [...corner.matchAll(/(-?[\d.]+) (-?[\d.]+)/g)].map((m) => Number(m[2]));
check(Math.max(...ys.slice(0, 1), ...ys.slice(2)) <= 80 - 16, `tail base off the corner: ${corner}`);

// Thought bubble: a cloud plus two puffs on the side of the parent
const thought = shapeParts("thought", 220, 90, { seed: "abc", angle: 0 });
check(thought.length === cloud.length + 2, `thought adds two puffs: ${thought.length}`);
const puffs = thought.slice(-2).map((c) => c.match(/cx="(-?[\d.]+)" cy="(-?[\d.]+)" r="([\d.]+)"/).slice(1).map(Number));
check(puffs[0][0] > 220 && puffs[1][0] > puffs[0][0] && puffs[1][2] < puffs[0][2], `puffs go right and shrink: ${thought.slice(-2)}`);
const upPuff = shapeParts("thought", 220, 90, { seed: "abc", angle: -Math.PI / 2 }).at(-1).match(/cy="(-?[\d.]+)"/)[1];
check(Number(upPuff) < 0, `puffs go up: ${upPuff}`);

// Ellipse: the corners of the text, inset by the padding, stay inside
for (const [w, h] of [[220, 90], [250, 150], [170, 60]]) {
  const [rx, ry] = shapeParts("ellipse", w, h)[0].match(/rx="([\d.]+)" ry="([\d.]+)"/).slice(1).map(Number);
  const inside = ((w / 2 - 26) / rx) ** 2 + ((h / 2 - 12) / ry) ** 2;
  check(inside <= 1.0001 && rx >= w / 2 && ry >= h / 2, `ellipse ${w}x${h} holds the text: ${inside}`);
}

// Hexagon: points left and right of the box
const hex = [...shapeParts("hexagon", 200, 80)[0].matchAll(/(-?[\d.]+) (-?[\d.]+)/g)].map((m) => Number(m[1]));
check(Math.min(...hex) < 0 && Math.max(...hex) > 200, `hexagon points stick out: ${hex}`);

// Note slip: a body and a folded corner at the lower right
const note = shapeParts("note", 200, 80);
check(note.length === 2 && note[1].includes('class="shape-fold"') && note[1].includes("M 184 80"), `note has a fold: ${note}`);

check(shapeParts("card", 100, 50).length === 0, "CSS shapes have no SVG parts");
check(shapeParts("underline", 100, 50).length === 0, "underline is drawn by CSS");
document.getElementById("out").textContent = fails.length ? "FAIL\n" + fails.join("\n") : "PASS";
</script>
