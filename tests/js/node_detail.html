<!doctype html>
<!-- Browser test for compact notes on the map. Run: python3 -m http.server in the repo root,
     open http://localhost:8000/tests/js/node_detail.html, it shows PASS or the failures. --><meta charset="utf-8"><body><pre id="out">running</pre>
<script type="module">
import { NODE_DETAIL_ZOOM, compactNodeInfo, nextNodeDetail, nodeDetailButton, nodeDetailCompact, nodeDetailMode, nodeStatus } from "../../custom_components/brainstorm/cards/brainstorm-i18n.js";
const fails = [];
const check = (name, got, want) => { if (JSON.stringify(got) !== JSON.stringify(want)) fails.push(`${name}: want ${JSON.stringify(want)}, got ${JSON.stringify(got)}`); };

// Modes
check("unknown is auto", nodeDetailMode("x"), "auto");
check("known", nodeDetailMode("compact"), "compact");
check("compact always", nodeDetailCompact("compact", 2), true);
check("normal never", nodeDetailCompact("normal", 0.2), false);
check("auto zoomed in", nodeDetailCompact("auto", 1), false);
check("auto zoomed out", nodeDetailCompact("auto", NODE_DETAIL_ZOOM - 0.05), true);
check("cycle", [nextNodeDetail("auto"), nextNodeDetail("compact"), nextNodeDetail("normal"), nextNodeDetail(null)], ["compact", "normal", "auto", "compact"]);
check("icons differ", new Set(["auto", "compact", "normal"].map((m) => nodeDetailButton(m).icon)).size, 3);

// The one status of a note
const now = new Date("2026-11-15T12:00:00").getTime();
check("normal", nodeStatus({ priority: "medium" }, now).key, "normal");
check("urgent", nodeStatus({ priority: "urgent" }, now).key, "urgent");
check("high", nodeStatus({ priority: "high" }, now).key, "high");
check("working", nodeStatus({ priority: "urgent", in_progress: { name: "Jan" } }, now).key, "working");
check("overdue", nodeStatus({ in_progress: {}, due: "2026-11-14T10:00:00" }, now).key, "overdue");
check("not yet due", nodeStatus({ due: "2026-11-16T10:00:00" }, now).key, "normal");
check("blocked first", nodeStatus({ due: "2026-11-14T10:00:00", blocked_by: [{ id: "x" }] }, now).key, "blocked");

// Dot and subtasks
const box = document.createElement("div");
box.innerHTML = compactNodeInfo({ priority: "high" }, 3, now);
check("dot", box.querySelector(".node-dot").className, "node-dot dot-high");
check("kids", box.querySelector(".node-kids").textContent, "3");
box.innerHTML = compactNodeInfo({}, 0, now);
check("no kids", box.querySelector(".node-kids"), null);
check("plain dot has no hint", box.querySelector(".node-dot").hasAttribute("title"), false);

document.getElementById("out").textContent = fails.length ? `FAIL\n${fails.join("\n")}` : "PASS";
</script>
