<!doctype html>
<!-- Browser test for "My day". Run: python3 -m http.server in the repo root,
     open http://localhost:8000/tests/js/my_day.html, it shows PASS or the failures. --><meta charset="utf-8"><body><pre id="out">running</pre>
<script type="module">
import { emptyFilter, filterActive, filterToRule, ideaMatches, myDayBadge, myDayOptions, myDayRank, ruleFilter } from "../../custom_components/brainstorm/cards/brainstorm-i18n.js";
const fails = [];
const check = (name, got, want) => { if (JSON.stringify(got) !== JSON.stringify(want)) fails.push(`${name}: want ${JSON.stringify(want)}, got ${JSON.stringify(got)}`); };
const filter = emptyFilter();
check("off", filterActive(filter), false);
filter.myDay = true;
check("on", filterActive(filter), true);
check("picked fits", ideaMatches({ text: "a", my_day: "evening" }, filter), true);
check("other does not", ideaMatches({ text: "b" }, filter), false);
check("rule keeps it", ruleFilter({ when: filterToRule(filter) }).myDay, true);
check("badge", myDayBadge({ my_day: "morning" }).includes("🌅"), true);
check("no badge", myDayBadge({ my_day: "noon" }), "");
check("ranks", [{ my_day: "evening" }, {}, { my_day: "morning" }, { my_day: "day" }].map(myDayRank), [2, 3, 0, 1]);
check("selected", myDayOptions("evening").includes('value="evening" selected'), true);
check("empty option", myDayOptions("").startsWith('<option value="">'), true);
document.getElementById("out").textContent = fails.length ? "FAIL\n" + fails.join("\n") : "PASS";
</script>
