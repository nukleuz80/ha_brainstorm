add_idea:
  fields:
    text:
      required: true
      example: "Wohnzimmer: Neue LED Leiste anbringen"
      selector:
        text:
          multiline: true
    description:
      required: false
      example: "Im Baumarkt nach 5 m mit Netzteil schauen"
      selector:
        text:
          multiline: true
    category:
      required: false
      example: "Smarthome"
      selector:
        text:
    priority:
      required: false
      example: "high"
      selector:
        select:
          options:
            - low
            - medium
            - high
            - urgent
    source:
      required: false
      example: "alexa"
      selector:
        text:
    device:
      required: false
      example: "Echo Show Küche"
      selector:
        text:
    language:
      required: false
      example: "en"
      selector:
        text:
    tags:
      required: false
      selector:
        object:
    parent_id:
      required: false
      example: "42fdbc8c"
      selector:
        text:
    due:
      required: false
      selector:
        datetime:
    parse_due:
      required: false
      default: false
      selector:
        boolean:
    assignee:
      required: false
      selector:
        entity:
          domain: person
    zone:
      required: false
      selector:
        entity:
          domain: zone

update_idea:
  fields:
    id:
      required: true
      example: "a1b2c3d4"
      selector:
        text:
    text:
      required: false
      selector:
        text:
    description:
      required: false
      example: "Im Baumarkt nach 5 m mit Netzteil schauen"
      selector:
        text:
          multiline: true
    category:
      required: false
      selector:
        text:
    priority:
      required: false
      example: "high"
      selector:
        select:
          options:
            - low
            - medium
            - high
            - urgent
    status:
      required: false
      selector:
        select:
          options:
            - active
            - completed
            - archived
    device:
      required: false
      selector:
        text:
    parent_id:
      required: false
      example: "42fdbc8c"
      selector:
        text:
    order:
      required: false
      selector:
        number:
          mode: box
    due:
      required: false
      selector:
        datetime:
    assignee:
      required: false
      selector:
        entity:
          domain: person
    zone:
      required: false
      selector:
        entity:
          domain: zone
    echos:
      required: false
      selector:
        entity:
          domain: media_player
          integration: alexa_media
          multiple: true
    result:
      required: false
      example: "Erledigt in v1.6.18, getestet"
      selector:
        text:
          multiline: true
    in_progress:
      required: false
      selector:
        boolean:
    shape:
      required: false
      selector:
        select:
          translation_key: node_shape
          options:
            - card
            - cloud
            - bubble
            - thought
            - pill
            - rect
            - ellipse
            - hexagon
            - note
            - underline
    markers:
      required: false
      example: '["question", "money"]'
      selector:
        select:
          translation_key: marker
          multiple: true
          options:
            - question
            - idea
            - warning
            - money
            - star
            - flag
            - check
            - blocked
            - waiting
            - heart
    progress:
      required: false
      selector:
        select:
          options:
            - "0"
            - "25"
            - "50"
            - "75"
            - "100"
    links:
      required: false
      example: '[{"to": "abc123", "label": "blockiert", "blocks": true}]'
      selector:
        object:
    frame:
      required: false
      example: "Phase 1"
      selector:
        text:
    callout:
      required: false
      example: "Angebot von Firma B abwarten"
      selector:
        text:
    numbering:
      required: false
      selector:
        select:
          translation_key: numbering
          options:
            - decimal
            - alpha
            - roman
    repeat:
      required: false
      selector:
        select:
          translation_key: repeat
          options:
            - daily
            - weekdays
            - weekly
            - biweekly
            - monthly
            - yearly

delete_idea:
  fields:
    id:
      required: true
      selector:
        text:

delete_done:
  fields:
    older_than_days:
      required: false
      default: 0
      selector:
        number:
          min: 0
          max: 3650
          unit_of_measurement: d
          mode: box

restore_idea:
  fields:
    id:
      required: true
      selector:
        text:

get_ideas:
  fields:
    category:
      required: false
