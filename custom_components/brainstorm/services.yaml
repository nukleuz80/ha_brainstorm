add_idea:
  fields:
    text:
      required: true
      example: "Wohnzimmer: Neue LED Leiste anbringen"
      selector:
        text:
          multiline: true
    category:
      required: false
      example: "Smarthome"
      selector:
        text:
    priority:
      required: false
      example: "high"
      selector:
        select:
          options:
            - low
            - medium
            - high
            - urgent
    source:
      required: false
      example: "alexa"
      selector:
        text:
    device:
      required: false
      example: "Echo Show Küche"
      selector:
        text:
    language:
      required: false
      example: "en"
      selector:
        text:
    tags:
      required: false
      selector:
        object:
    parent_id:
      required: false
      example: "42fdbc8c"
      selector:
        text:
    due:
      required: false
      selector:
        datetime:
    parse_due:
      required: false
      default: false
      selector:
        boolean:
    assignee:
      required: false
      selector:
        entity:
          domain: person
    zone:
      required: false
      selector:
        entity:
          domain: zone

update_idea:
  fields:
    id:
      required: true
      example: "a1b2c3d4"
      selector:
        text:
    text:
      required: false
      selector:
        text:
    category:
      required: false
      selector:
        text:
    priority:
      required: false
      example: "high"
      selector:
        select:
          options:
            - low
            - medium
            - high
            - urgent
    status:
      required: false
      selector:
        select:
          options:
            - active
            - completed
            - archived
    device:
      required: false
      selector:
        text:
    parent_id:
      required: false
      example: "42fdbc8c"
      selector:
        text:
    order:
      required: false
      selector:
        number:
          mode: box
    due:
      required: false
      selector:
        datetime:
    assignee:
      required: false
      selector:
        entity:
          domain: person
    zone:
      required: false
      selector:
        entity:
          domain: zone
    echos:
      required: false
      selector:
        entity:
          domain: media_player
          integration: alexa_media
          multiple: true

delete_idea:
  fields:
    id:
      required: true
      selector:
        text:

get_ideas:
  fields:
    category:
      required: false
      selector:
        text:
    priority:
      required: false
      selector:
        select:
          options:
            - low
            - medium
            - high
            - urgent
    status:
      default: "active"
      selector:
        select:
          options:
            - active
            - completed
            - all

