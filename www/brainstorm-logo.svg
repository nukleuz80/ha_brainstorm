<svg xmlns="http://www.w3.org/2000/svg" viewBox="146 66 220 336" width="100%" height="100%" style="display:block; overflow:visible;">
  <defs>
    <!-- Brain & Circuit Gradients -->
    <linearGradient id="neonCyan_logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <linearGradient id="neonPurple_logo" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a8d" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#5a189a" />
    </linearGradient>

    <linearGradient id="bulbAmber_logo" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d" />
      <stop offset="60%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>

    <linearGradient id="metalBase_logo" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4a5568" />
      <stop offset="50%" stop-color="#a0aec0" />
      <stop offset="100%" stop-color="#2d3748" />
    </linearGradient>

    <filter id="glow_logo" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient light halo -->
  <circle cx="256" cy="220" r="85" fill="url(#neonPurple_logo)" opacity="0.22" filter="url(#glow_logo)" />
  <circle cx="256" cy="210" r="50" fill="url(#neonCyan_logo)" opacity="0.18" filter="url(#glow_logo)" />

  <!-- Outer Bulb Glass Outline -->
  <path d="M165 210 C165 145, 200 100, 256 100 C312 100, 347 145, 347 210 C347 252, 320 285, 312 320 L200 320 C192 285, 165 252, 165 210 Z" 
        fill="none" 
        stroke="url(#neonCyan_logo)" 
        stroke-width="5" 
        filter="url(#glow_logo)" />

  <!-- Glass Highlight Reflection -->
  <path d="M185 185 C185 145, 210 118, 245 112" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3" 
        stroke-linecap="round" 
        opacity="0.6" />

  <!-- Left Hemisphere (Synaptic curves) -->
  <g filter="url(#glow_logo)">
    <path d="M 242 145 C 215 140, 190 160, 192 185 C 193 205, 210 210, 215 225 C 220 240, 205 255, 215 275 C 223 290, 238 295, 244 305" 
          fill="none" 
          stroke="url(#neonCyan_logo)" 
          stroke-width="4.5" 
          stroke-linecap="round" />
    <path d="M 215 185 Q 235 195 242 195" fill="none" stroke="url(#neonCyan_logo)" stroke-width="3" />
    <path d="M 215 235 Q 235 240 242 248" fill="none" stroke="url(#neonCyan_logo)" stroke-width="3" />
    <circle cx="192" cy="185" r="4.5" fill="#ffffff" />
    <circle cx="215" cy="225" r="4.5" fill="#ffffff" />
    <circle cx="215" cy="275" r="4" fill="#ffffff" />
  </g>

  <!-- Right Hemisphere (Creative/Sparking curves) -->
  <g filter="url(#glow_logo)">
    <path d="M 270 145 C 297 140, 322 160, 320 185 C 319 205, 302 210, 297 225 C 292 240, 307 255, 297 275 C 289 290, 274 295, 268 305" 
          fill="none" 
          stroke="url(#neonPurple_logo)" 
          stroke-width="4.5" 
          stroke-linecap="round" />
    <path d="M 297 185 Q 277 195 270 195" fill="none" stroke="url(#neonPurple_logo)" stroke-width="3" />
    <path d="M 297 235 Q 277 240 270 248" fill="none" stroke="url(#neonPurple_logo)" stroke-width="3" />
    <circle cx="320" cy="185" r="4.5" fill="#ffffff" />
    <circle cx="297" cy="225" r="4.5" fill="#ffffff" />
    <circle cx="297" cy="275" r="4" fill="#ffffff" />
  </g>

  <!-- Central Inspiration Bolt / Idea Spark -->
  <g filter="url(#glow_logo)">
    <path d="M 258 135 L 246 195 L 265 195 L 248 260 L 270 208 L 253 208 Z" 
          fill="url(#bulbAmber_logo)" />
  </g>
  <circle cx="256" cy="198" r="6" fill="#ffffff" filter="url(#glow_logo)" />

  <!-- Bulb Base / Screws -->
  <g>
    <rect x="208" y="325" width="96" height="12" rx="6" fill="url(#metalBase_logo)" stroke="#1a202c" stroke-width="1.5" />
    <rect x="214" y="342" width="84" height="12" rx="6" fill="url(#metalBase_logo)" stroke="#1a202c" stroke-width="1.5" />
    <rect x="222" y="359" width="68" height="11" rx="5" fill="url(#metalBase_logo)" stroke="#1a202c" stroke-width="1.5" />
    <path d="M232 374 C232 374, 238 388, 256 388 C274 388, 280 374, 280 374 Z" fill="#2d3748" />
    <circle cx="256" cy="382" r="4" fill="#00f5ff" />
  </g>

  <!-- Floating Sparkles / Energy -->
  <path d="M 170 125 L 175 135 L 185 140 L 175 145 L 170 155 L 165 145 L 155 140 L 165 135 Z" fill="#00f5ff" opacity="0.9" filter="url(#glow_logo)" />
  <path d="M 345 120 L 350 128 L 358 132 L 350 136 L 345 144 L 340 136 L 332 132 L 340 128 Z" fill="#ff2a8d" opacity="0.9" filter="url(#glow_logo)" />
  <path d="M 256 70 L 260 78 L 268 82 L 260 86 L 256 94 L 252 86 L 244 82 L 252 78 Z" fill="#ffe66d" opacity="0.95" filter="url(#glow_logo)" />
</svg>
