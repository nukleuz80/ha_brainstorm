<svg xmlns="http://www.w3.org/2000/svg" viewBox="70 50 372 355" width="100%" height="100%">
  <defs>
    <!-- Brain & Circuit Gradients -->
    <linearGradient id="neonCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0072ff" />
    </linearGradient>

    <linearGradient id="neonPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a8d" />
      <stop offset="50%" stop-color="#9d4edd" />
      <stop offset="100%" stop-color="#5a189a" />
    </linearGradient>

    <linearGradient id="bulbAmber" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffe66d" />
      <stop offset="60%" stop-color="#ffb703" />
      <stop offset="100%" stop-color="#fb8500" />
    </linearGradient>

    <linearGradient id="metalBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="glowEffect" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="intenseGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Ambient Light Halo (Transparent Background) -->
  <circle cx="256" cy="220" r="140" fill="#9d4edd" opacity="0.18" filter="url(#glowEffect)" />
  <circle cx="256" cy="210" r="80" fill="#00f5ff" opacity="0.20" filter="url(#glowEffect)" />

  <!-- Decorative Orbit Nodes (Smart Home Network) -->
  <g opacity="0.45" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4,6">
    <ellipse cx="256" cy="225" rx="180" ry="115" fill="none" transform="rotate(-18 256 225)" />
    <ellipse cx="256" cy="225" rx="180" ry="115" fill="none" transform="rotate(22 256 225)" />
  </g>

  <!-- Network Satellites / Smart Home Nodes -->
  <circle cx="95" cy="180" r="6" fill="#00f5ff" filter="url(#intenseGlow)" />
  <circle cx="410" cy="165" r="5" fill="#ff2a8d" filter="url(#intenseGlow)" />
  <circle cx="390" cy="310" r="7" fill="#ffe66d" filter="url(#intenseGlow)" />
  <circle cx="120" cy="300" r="5" fill="#9d4edd" filter="url(#intenseGlow)" />

  <!-- Connection Lines from Nodes to Core -->
  <path d="M95 180 Q 170 190 200 210" stroke="#00f5ff" stroke-width="1.8" fill="none" opacity="0.45" />
  <path d="M410 165 Q 340 180 312 210" stroke="#ff2a8d" stroke-width="1.8" fill="none" opacity="0.45" />
  <path d="M390 310 Q 330 290 300 270" stroke="#ffe66d" stroke-width="1.8" fill="none" opacity="0.45" />
  <path d="M120 300 Q 180 280 212 270" stroke="#9d4edd" stroke-width="1.8" fill="none" opacity="0.45" />

  <!-- Outer Bulb Glass Outline -->
  <path d="M165 210 C165 145, 200 100, 256 100 C312 100, 347 145, 347 210 C347 252, 320 285, 312 320 L200 320 C192 285, 165 252, 165 210 Z" 
        fill="none" 
        stroke="url(#neonCyan)" 
        stroke-width="5" 
        filter="url(#intenseGlow)" />

  <!-- Glass Highlight Reflection -->
  <path d="M185 185 C185 145, 210 118, 245 112" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        opacity="0.6" />

  <!-- Brain Synapses / Filament Core -->
  <!-- Left Hemisphere (Synaptic curves) -->
  <g filter="url(#intenseGlow)">
    <path d="M 242 145 C 215 140, 190 160, 192 185 C 193 205, 210 210, 215 225 C 220 240, 205 255, 215 275 C 223 290, 238 295, 244 305" 
          fill="none" 
          stroke="url(#neonCyan)" 
          stroke-width="4.5" 
          stroke-linecap="round" />
    <path d="M 215 185 Q 235 195 242 195" fill="none" stroke="url(#neonCyan)" stroke-width="3" />
    <path d="M 215 235 Q 235 240 242 248" fill="none" stroke="url(#neonCyan)" stroke-width="3" />
    <circle cx="192" cy="185" r="4.5" fill="#ffffff" />
    <circle cx="215" cy="225" r="4.5" fill="#ffffff" />
    <circle cx="215" cy="275" r="4" fill="#ffffff" />
  </g>

  <!-- Right Hemisphere (Creative/Sparking curves) -->
  <g filter="url(#intenseGlow)">
    <path d="M 270 145 C 297 140, 322 160, 320 185 C 319 205, 302 210, 297 225 C 292 240, 307 255, 297 275 C 289 290, 274 295, 268 305" 
          fill="none" 
          stroke="url(#neonPurple)" 
          stroke-width="4.5" 
          stroke-linecap="round" />
    <path d="M 297 185 Q 277 195 270 195" fill="none" stroke="url(#neonPurple)" stroke-width="3" />
    <path d="M 297 235 Q 277 240 270 248" fill="none" stroke="url(#neonPurple)" stroke-width="3" />
    <circle cx="320" cy="185" r="4.5" fill="#ffffff" />
    <circle cx="297" cy="225" r="4.5" fill="#ffffff" />
    <circle cx="297" cy="275" r="4" fill="#ffffff" />
  </g>

  <!-- Central Inspiration Bolt / Idea Spark -->
  <g filter="url(#glowEffect)">
    <path d="M 258 135 L 246 195 L 265 195 L 248 260 L 270 208 L 253 208 Z" 
          fill="url(#bulbAmber)" />
  </g>
  <circle cx="256" cy="198" r="7" fill="#ffffff" filter="url(#intenseGlow)" />

  <!-- Bulb Base / Screws (Smart Fitting with Glow Contact) -->
  <g>
    <!-- Thread Ring 1 -->
    <rect x="208" y="325" width="96" height="12" rx="6" fill="url(#metalBase)" stroke="#334155" stroke-width="1.5" />
    <!-- Thread Ring 2 -->
    <rect x="214" y="342" width="84" height="12" rx="6" fill="url(#metalBase)" stroke="#334155" stroke-width="1.5" />
    <!-- Thread Ring 3 -->
    <rect x="222" y="359" width="68" height="11" rx="5" fill="url(#metalBase)" stroke="#334155" stroke-width="1.5" />
    <!-- Bottom Contact -->
    <path d="M232 374 C232 374, 238 388, 256 388 C274 388, 280 374, 280 374 Z" fill="#334155" />
    <circle cx="256" cy="382" r="4" fill="#00f5ff" filter="url(#intenseGlow)" />
  </g>

  <!-- Floating Sparkles / Brain Energy -->
  <path d="M 170 125 L 175 135 L 185 140 L 175 145 L 170 155 L 165 145 L 155 140 L 165 135 Z" fill="#00f5ff" opacity="0.9" filter="url(#intenseGlow)" />
  <path d="M 345 120 L 350 128 L 358 132 L 350 136 L 345 144 L 340 136 L 332 132 L 340 128 Z" fill="#ff2a8d" opacity="0.9" filter="url(#intenseGlow)" />
  <path d="M 256 70 L 260 78 L 268 82 L 260 86 L 256 94 L 252 86 L 244 82 L 252 78 Z" fill="#ffe66d" opacity="0.95" filter="url(#intenseGlow)" />
</svg>
