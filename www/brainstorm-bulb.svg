<svg xmlns="http://www.w3.org/2000/svg" viewBox="136 58 240 261" width="100%" height="100%">
  <defs>
    <!-- Brain & Circuit Gradients -->
    <linearGradient id="neonCyan_bulb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f5ff" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>

    <linearGradient id="neonPurple_bulb" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ff2a8d" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <linearGradient id="bulbAmber_bulb" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f97316" />
    </linearGradient>

    <linearGradient id="metalBase_bulb" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <filter id="glow_bulb" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Soft Ambient Light Halo (Transparent Background) -->
  <circle cx="256" cy="178" r="85" fill="#00f5ff" opacity="0.16" filter="url(#glow_bulb)" />

  <!-- Outer Bulb Glass Contour (Fuller, bolder, fills 100% of space) -->
  <path d="M 144 178 C 144 116, 194 66, 256 66 C 318 66, 368 116, 368 178 C 368 222, 326 248, 306 272 L 206 272 C 186 248, 144 222, 144 178 Z" 
        fill="none" 
        stroke="url(#neonCyan_bulb)" 
        stroke-width="12" 
        stroke-linejoin="round" 
        opacity="0.95" />

  <!-- Glass Highlight Reflection -->
  <path d="M 166 150 C 166 112, 196 86, 238 78" 
        fill="none" 
        stroke="#ffffff" 
        stroke-width="6" 
        stroke-linecap="round" 
        opacity="0.8" />

  <!-- Digital Circuit Brain Synapses (Left Hemisphere) -->
  <g filter="url(#glow_bulb)">
    <path d="M 240 110 C 206 106, 180 134, 182 165 C 183 186, 202 192, 206 208 C 210 224, 196 236, 206 254 C 214 266, 228 268, 238 270" 
          fill="none" 
          stroke="url(#neonCyan_bulb)" 
          stroke-width="11" 
          stroke-linecap="round" />
    <path d="M 195 170 Q 220 178 238 178" fill="none" stroke="url(#neonCyan_bulb)" stroke-width="7" stroke-linecap="round" />
    <path d="M 206 215 Q 225 218 238 224" fill="none" stroke="url(#neonCyan_bulb)" stroke-width="7" stroke-linecap="round" />
    <circle cx="182" cy="165" r="6" fill="#00f5ff" />
    <circle cx="206" cy="208" r="6" fill="#00f5ff" />
    <circle cx="206" cy="254" r="6" fill="#00f5ff" />
  </g>

  <!-- Creative Folds Brain (Right Hemisphere) -->
  <g filter="url(#glow_bulb)">
    <path d="M 272 110 C 306 106, 332 134, 330 165 C 329 186, 310 192, 306 208 C 302 224, 316 236, 306 254 C 298 266, 284 268, 274 270" 
          fill="none" 
          stroke="url(#neonPurple_bulb)" 
          stroke-width="11" 
          stroke-linecap="round" />
    <path d="M 317 170 Q 292 178 274 178" fill="none" stroke="url(#neonPurple_bulb)" stroke-width="7" stroke-linecap="round" />
    <path d="M 306 215 Q 287 218 274 224" fill="none" stroke="url(#neonPurple_bulb)" stroke-width="7" stroke-linecap="round" />
    <circle cx="330" cy="165" r="6" fill="#ff2a8d" />
    <circle cx="306" cy="208" r="6" fill="#ff2a8d" />
    <circle cx="306" cy="254" r="6" fill="#ff2a8d" />
  </g>

  <!-- Central Idea Lightning Bolt / Spark -->
  <g filter="url(#glow_bulb)">
    <path d="M 258 100 L 244 158 L 268 158 L 246 226 L 274 168 L 252 168 Z" fill="url(#bulbAmber_bulb)" />
  </g>
  <circle cx="256" cy="162" r="8" fill="#ffffff" />

  <!-- Compact Metallic Base Fitting -->
  <rect x="202" y="275" width="108" height="13" rx="6.5" fill="url(#metalBase_bulb)" stroke="rgba(0,0,0,0.18)" stroke-width="1.5" />
  <rect x="212" y="290" width="88" height="12" rx="6" fill="url(#metalBase_bulb)" stroke="rgba(0,0,0,0.18)" stroke-width="1.5" />
  <path d="M 230 304 C 230 304, 238 316, 256 316 C 274 316, 282 304, 282 304 Z" fill="#334155" />
  <circle cx="256" cy="310" r="4" fill="#00f5ff" />
</svg>
